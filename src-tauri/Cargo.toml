[package]
name="vimarsa"
version="0.2.0"
edition="2021"
[build-dependencies]
tauri-build={version="2.6.3"}
[dependencies]
anyhow="1"
ignore="0.4"
regex="1"
serde={version="1",features=["derive"]}
serde_json="1"
tauri={version="2.11.5",features=[]}
tauri-plugin-dialog={version="2.7.2"}
[features]
default=["custom-protocol"]
custom-protocol=["tauri/custom-protocol"]
